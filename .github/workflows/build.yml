name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing key
        run: base64 -d app/callnotes.jks.b64 > app/callnotes.jks

      - name: Build
        run: gradle assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk CallNotes.apk

      - name: Save APK as a download
        uses: actions/upload-artifact@v4
        with:
          name: CallNotes
          path: CallNotes.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Call Notes v1.0.${{ github.run_number }}
          files: CallNotes.apk
